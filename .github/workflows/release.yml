# Builds, packages and publishes a DeckCraft release through the shared Craft release workflow
# (685ks/craft-actions). It reads packaging/app.toml and names the assets
# deckcraft-<version>-<os>-<arch>[-portable].<ext>. The release is a draft unless `publish` is set.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.9.0 or 0.9.1-rc.1)"
        type: string
        required: true
      publish:
        description: "Publish the GitHub Release (otherwise it stays a draft)"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: 685ks/craft-actions/.github/workflows/release-rust-app.yml@main
    with:
      app-id: deckcraft
      display-name: DeckCraft
      bundle-id: app.freedev.ainz.ks.DeckCraft
      version: ${{ inputs.version }}
      package: deckcraft
      bin: deckcraft
      features: ""
      publish: ${{ inputs.publish }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
